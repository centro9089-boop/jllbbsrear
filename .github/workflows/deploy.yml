
name: Publicar pagina en Surge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Surge
        run: npm install --global surge

      - name: Preparar pagina principal
        run: cp 1.html index.html

      - name: Publicar en Surge
        run: surge . miweb-jllbbsrear.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
